# 两个服务共用同一个数据卷：
#   collector —— 常驻采集，把 ~/.codex/sessions 的增量写进 /data/agent-lens.db
#   web       —— 只读查询 + 托管前端，暴露 8000 端口
# 事实源以只读方式挂进来，容器永远不会修改 Codex 的原始日志。

services:
  collector:
    build: .
    image: agent-lens:local
    command: ["agent-lens", "collect"]
    restart: unless-stopped
    volumes:
      - "${CODEX_SESSIONS_DIR:-${HOME}/.codex/sessions}:/codex/sessions:ro"
      - lens-data:/data

  web:
    image: agent-lens:local
    build: .
    command: ["agent-lens", "serve", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    depends_on:
      - collector
    ports:
      - "${AGENT_LENS_PORT:-8000}:8000"
    volumes:
      - "${CODEX_SESSIONS_DIR:-${HOME}/.codex/sessions}:/codex/sessions:ro"
      - lens-data:/data

  # 开发用：Vite dev server（带 HMR），源码从宿主挂进去，改了立刻生效。
  #   docker compose --profile dev up -d web-dev
  # 只在需要改前端时才用；平时看数据用上面的 web（生产产物）就够。
  web-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /web
    # --no-package-lock / --no-save：容器里的 npm 版本与宿主不同，让它别去改宿主的
    # package-lock.json（实测会删掉 libc 元数据，那是版本差异不是真实变更）。
    command: >
      sh -c "npm install --no-save --no-package-lock --no-audit --no-fund &&
             npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      # 容器里后端是 compose 的服务名，不是 127.0.0.1
      VITE_PROXY_TARGET: http://web:8000
    ports:
      - "${AGENT_LENS_DEV_PORT:-5173}:5173"
    volumes:
      - ./web:/web
      # node_modules 放命名卷：宿主的依赖是 darwin 构建的，直接挂进 linux 容器会跑不起来
      - web-node-modules:/web/node_modules
    depends_on:
      - web

volumes:
  lens-data:
  web-node-modules:
